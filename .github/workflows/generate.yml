
name: Generate Unicode Casing Reference Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/generate.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 13
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '13.0.14+5'

      - name: Verify Java version
        run: java --version

      - name: Compile generator
        run: |
          mkdir -p build
          javac -d build src/GenerateCharacterCasingData.java

      - name: Generate C# reference data
        run: |
          mkdir -p generated
          java -cp build GenerateCharacterCasingData generated/CharacterCasingData.cs

      - name: Upload generated reference data
        uses: actions/upload-artifact@v4
        with:
          name: unicode-12.1-casing-reference
          path: generated/CharacterCasingData.cs
          if-no-files-found: error
          retention-days: 90
